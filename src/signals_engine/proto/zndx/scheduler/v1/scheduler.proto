// zndx.scheduler.v1 — federated *scheduler* capability (not a vendor).
//
// WHY a separate service: queue / job admission is not inference. Crowding
// Engine with policy lifecycle RPCs blurs capability boundaries. Engine keeps
// Complete / Status / Remediate; this service is the platform scheduler face.
//
// CAPABILITY, NOT IMPLEMENTATION:
//   Status on zndx.engine.v1.Engine advertises capability="scheduler" and
//   model="<backend>" (lab: "yunikorn"; later "slurm", "pbs", …).
//   Thin clients MUST NOT name a vendor. The engine privately talks to the
//   backend (YK REST + ConfigMap, SLURM REST/CLI, PBS, …).
//
// VOCABULARY (backend-mapped, not YuniKorn-shaped):
//   partition    — scheduling domain (YK partition, SLURM partition, PBS server)
//   queue        — named share / ACL / quota tree node
//   application  — submitted workload (YK app, SLURM/PBS job)
//   task         — running allocation (YK container, SLURM step, PBS task)
//   node         — schedulable host
//   resource keys — backend-defined strings (memory/vcore/pods vs ncpus/mem/gres)
//
// Registered BESIDE zndx.engine.v1.Engine on the Signals lattice port
// (multi-service gRPC). Additive-only within v1.
//
// Spec: specification/protocol/scheduler_grpc.md

syntax = "proto3";
package zndx.scheduler.v1;

// WorkloadRequirement lives in the engine surface (peers advertise it via
// Engine/ServerQuery kind=WORKLOADS); admission carries the same requirements
// so the Signals engine sizes YuniKorn queues from what workloads actually need.
import "zndx/engine/v1/engine.proto";

service Scheduler {
  // ── Runtime (backend-private; product clients stay on this service) ──
  rpc ListPartitions(ListPartitionsRequest) returns (ListPartitionsResponse);
  rpc GetQueueTree(GetQueueTreeRequest) returns (GetQueueTreeResponse);
  rpc GetQueue(GetQueueRequest) returns (GetQueueResponse);
  rpc ListQueueApplications(ListQueueApplicationsRequest) returns (ListQueueApplicationsResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetPlacementPolicy(GetPlacementPolicyRequest) returns (GetPlacementPolicyResponse);
  rpc GetDeclaredConfig(GetDeclaredConfigRequest) returns (GetDeclaredConfigResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);

  // ── Projection lifecycle (Signals-owned; Aegir-shaped roots) ──────────
  // current = active policy view + live overlay
  // scratch = edit/review pending promote
  // archive = freezes of past applied configs
  rpc SyncProjection(SyncProjectionRequest) returns (SyncProjectionResponse);
  rpc GetProjectionIndex(GetProjectionIndexRequest) returns (GetProjectionIndexResponse);
  rpc GetProjectionNote(GetProjectionNoteRequest) returns (GetProjectionNoteResponse);
  rpc WriteScratchConfig(WriteScratchConfigRequest) returns (WriteScratchConfigResponse);
  rpc DiffConfig(DiffConfigRequest) returns (DiffConfigResponse);
  rpc PromoteScratch(PromoteScratchRequest) returns (PromoteScratchResponse);
  rpc ListArchives(ListArchivesRequest) returns (ListArchivesResponse);
  rpc RestoreArchiveToScratch(RestoreArchiveToScratchRequest) returns (RestoreArchiveToScratchResponse);

  // ── Queue share (peer occupancy intent over time) ─────────────────────
  // Peers request guaranteed/max capacity on resource-class leaves as their
  // WRK mix changes. YK preemption only fires when a queue is *under* its
  // guarantee; Signals records these requests (this RPC) and later applies
  // config deltas. Peers NEVER call the scheduler-backend REST.
  // (added 2026-08-22, gaius — additive v1.)
  rpc RequestQueueShare(QueueShareRequest) returns (QueueShareResponse);
  rpc ListQueueShareRequests(ListQueueShareRequestsRequest) returns (ListQueueShareRequestsResponse);

  // ── Coordination Activities (intent with a lifetime) ──────────────────
  // A peer ENGINE declares an Activity (zndx.engine.v1.Activity) on behalf of
  // one of its local processes; Signals materialises it as a run of its own
  // Airflow DAG and is the ONLY party that talks to Airflow. Peers renew
  // before the horizon, release when done, and Watch to learn every peer's
  // in-force activities. Local processes never call these: they ask their
  // local engine (Engine/ServerQuery kind=ACTIVITIES; supervision
  // ActivityEvent). (added 2026-09-06 — additive v1.)
  rpc DeclareActivity(DeclareActivityRequest) returns (ActivityResponse);
  rpc RenewActivity(RenewActivityRequest) returns (ActivityResponse);
  rpc ReleaseActivity(ReleaseActivityRequest) returns (ActivityResponse);
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  rpc WatchActivities(WatchActivitiesRequest) returns (stream ActivityWatchEvent);

  // ── Workload catalogue (engines SUBMIT their scheduled workloads) ───────
  // Every project's engine submits its catalogue (zndx.engine.v1.ScheduleHint
  // entries: class, cadence or `after` ordering, claims = YK queue config,
  // postures, horizon). Signals owns the Airflow that materialises them:
  // one DAG per enabled entry whose runs are Activities, so the arbiter
  // applies each workload's configuration to YuniKorn for exactly the
  // duration of the active run — Metaflow, scheduled task or the interactive
  // agent-rtc workflow alike. (added 2026-09-07 — additive v1.)
  rpc SyncWorkloads(SyncWorkloadsRequest) returns (SyncWorkloadsResponse);
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);
}

// ── Roots ───────────────────────────────────────────────────────────────

enum ProjectionRoot {
  PROJECTION_ROOT_UNSPECIFIED = 0;
  CURRENT = 1;   // active / authority for what should control allocations
  SCRATCH = 2;   // WIP edit surface
  ARCHIVE = 3;   // freezes (list uses archive_id on note path)
}

// Opaque policy document. Backend chooses media_type + body shape.
// Lab YuniKorn: media_type=text/yaml, body=queues.yaml partitions document.
message PolicyDocument {
  string media_type = 1;  // e.g. text/yaml, application/json, text/plain
  string body = 2;
}

// ── Ops messages ────────────────────────────────────────────────────────

message ListPartitionsRequest {}

message PartitionInfo {
  string name = 1;
  string state = 2;
  string site_id = 3;                // cluster / site / RM id (backend)
  map<string, int64> capacity = 4;   // backend resource keys
  map<string, int64> used_capacity = 5;
  int32 total_nodes = 6;
  bool preemption_enabled = 7;
}

message ListPartitionsResponse {
  repeated PartitionInfo partitions = 1;
}

message GetQueueTreeRequest {
  string partition = 1;  // empty = backend default
}

message ResourceMap {
  map<string, int64> quantities = 1;  // backend keys
}

message QueueNode {
  string name = 1;                     // FQN e.g. root.signals
  string status = 2;
  bool is_leaf = 3;
  bool is_managed = 4;
  string parent = 5;
  ResourceMap max = 6;
  ResourceMap guaranteed = 7;
  ResourceMap allocated = 8;
  ResourceMap pending = 9;
  ResourceMap headroom = 10;
  map<string, double> abs_used_capacity = 11;  // fraction or percent (backend)
  int32 max_running_apps = 12;
  int32 running_apps = 13;
  string sorting_policy = 14;
  bool preemption_enabled = 15;
  map<string, string> properties = 16;
  repeated QueueNode children = 17;
}

message GetQueueTreeResponse {
  string partition = 1;
  QueueNode root = 2;
}

message GetQueueRequest {
  string partition = 1;
  string queue = 2;       // FQN
  bool include_subtree = 3;
}

message GetQueueResponse {
  string partition = 1;
  QueueNode queue = 2;
}

message ListQueueApplicationsRequest {
  string partition = 1;
  string queue = 2;
}

message ApplicationInfo {
  string application_id = 1;
  string state = 2;
  string queue_name = 3;
  string user = 4;
  ResourceMap used = 5;
  int64 submission_time_ns = 6;
}

message ListQueueApplicationsResponse {
  repeated ApplicationInfo applications = 1;
}

message ListNodesRequest {
  string partition = 1;
}

message NodeInfo {
  string node_id = 1;
  string host_name = 2;
  string rack_name = 3;
  ResourceMap capacity = 4;
  ResourceMap allocated = 5;
  ResourceMap available = 6;
  bool schedulable = 7;
}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

message GetPlacementPolicyRequest {
  string partition = 1;
}

message PlacementRule {
  string name = 1;
  map<string, string> parameters = 2;
}

message GetPlacementPolicyResponse {
  repeated PlacementRule rules = 1;
}

message GetDeclaredConfigRequest {}

message GetDeclaredConfigResponse {
  PolicyDocument document = 1;
}

message ValidateConfigRequest {
  PolicyDocument document = 1;
}

message ValidateConfigResponse {
  bool ok = 1;
  string message = 2;
  repeated string errors = 3;
}

message HealthRequest {}

message HealthCheck {
  string name = 1;
  bool succeeded = 2;
  string description = 3;
  string diagnosis = 4;
}

message HealthResponse {
  bool healthy = 1;
  string backend = 2;  // implementation id (yunikorn, slurm, pbs, …)
  repeated HealthCheck checks = 3;
}

// ── Dashboard (landing Scheduler band) ─────────────────────────────────

message GetDashboardRequest {
  string partition = 1;  // empty = first / default
}

message SchedulerSummary {
  string name = 1;              // site / cluster display name
  string backend = 2;           // yunikorn | slurm | pbs | …
  string status = 3;            // partition / domain state
  int32 total_nodes = 4;
  string node_sort_policy = 5;
  int32 total_applications = 6;
  int32 total_tasks = 7;        // running allocations
  string partition = 8;
  string site_id = 9;
}

message StatusSlice {
  string label = 1;   // Running, Completed, …
  int32 count = 2;
}

message HistoryPoint {
  int64 timestamp_ns = 1;
  int64 value = 2;
}

message UtilBucket {
  string bucket_name = 1;  // 0-10%, 10-20%, …
  int32 num_nodes = 2;
}

message ResourceUtilization {
  string resource_type = 1;  // backend key
  repeated UtilBucket buckets = 2;
}

message GetDashboardResponse {
  SchedulerSummary summary = 1;
  repeated StatusSlice application_status = 2;
  repeated StatusSlice task_status = 3;
  repeated HistoryPoint application_history = 4;
  repeated HistoryPoint task_history = 5;
  repeated ResourceUtilization node_utilizations = 6;
  bool healthy = 7;
  string partition = 8;
  repeated string partitions = 9;
}

// ── Projection ──────────────────────────────────────────────────────────

message SyncProjectionRequest {
  // Rebuild current from live ops + declared config. Does not touch scratch.
  string partition = 1;
}

message SyncProjectionResponse {
  int32 notes_written = 1;
  string config_path = 2;  // relative under projection root
}

message GetProjectionIndexRequest {
  ProjectionRoot root = 1;
  string archive_id = 2;  // required when root=ARCHIVE
}

message ProjectionNoteMeta {
  string id = 1;
  string title = 2;
  string kind = 3;
  ProjectionRoot root = 4;
  string relpath = 5;
  repeated string links = 6;
}

message GetProjectionIndexResponse {
  repeated ProjectionNoteMeta notes = 1;
  int32 total = 2;
}

message GetProjectionNoteRequest {
  ProjectionRoot root = 1;
  string note_id = 2;
  string archive_id = 3;
}

message GetProjectionNoteResponse {
  string id = 1;
  string title = 2;
  string kind = 3;
  string body = 4;
  string frontmatter_json = 5;
  repeated string links = 6;
}

message WriteScratchConfigRequest {
  PolicyDocument document = 1;
  bool rebuild_notes = 2;
}

message WriteScratchConfigResponse {
  bool ok = 1;
  string message = 2;
}

message DiffConfigRequest {
  bool include_live = 1;
}

message DiffConfigResponse {
  string unified_diff = 1;  // scratch vs current
  string live_diff = 2;     // current vs live (if include_live)
}

message PromoteScratchRequest {
  bool dry_run = 1;
  string archive_stamp = 2;
}

message PromoteScratchResponse {
  bool ok = 1;
  string message = 2;
  string archive_id = 3;
  bool applied = 4;
  ValidateConfigResponse validation = 5;
}

message ListArchivesRequest {}

message ArchiveInfo {
  string id = 1;
  string created_at = 2;
  string note = 3;
}

message ListArchivesResponse {
  repeated ArchiveInfo archives = 1;
}

message RestoreArchiveToScratchRequest {
  string archive_id = 1;
}

message RestoreArchiveToScratchResponse {
  bool ok = 1;
  string message = 2;
}

// ── Queue share (WRK → leaf occupancy over time) ────────────────────────
//
// QueueHint on Engine/ServerQuery is the *declared leaf shape* (max, default
// guarantee). These messages are the *time series of requested deltas*:
// Gaius may need extract guarantee=1 while article-curate runs, then 0 so
// light/CLT or medium/SAE can raise their floor on a 6-GPU box.
// A task cannot trigger preemption unless its queue is under guarantee
// (YuniKorn preemption design). Signals is the SoR for that config.

enum QueueShareState {
  QUEUE_SHARE_STATE_UNSPECIFIED = 0;
  QUEUE_SHARE_RECORDED = 1;    // persisted; not yet applied to the backend
  QUEUE_SHARE_SUPERSEDED = 2;  // a later request from the same peer+queue
  QUEUE_SHARE_APPLIED = 3;     // backend config matches (Signals YK interop)
  QUEUE_SHARE_REJECTED = 4;    // recorded but cannot apply (over parent max)
  // The applier has taken this record's batch and the backend apply is in
  // flight. A peer waiting for APPLIED treats this as PROGRESS (reset its
  // patience), not as "still RECORDED": the apply is variable-latency and a
  // fixed deadline mistook a slow apply for a stalled one (2026-09-04).
  QUEUE_SHARE_APPLYING = 5;
}

// Host process / flow class that will occupy a queue as an Application.
message WorkloadIntent {
  reserved 3;  // was `string resource_class`; promoted to zndx.engine.v1.ResourceClass at field 7
  string wrk = 1;             // article-curate | optillm | thinking | ask-sae | clt-skos-label
  string queue = 2;           // occupancy FQN the caller chose (heavy/medium/light)
  int32 applications = 4;     // Applications this WRK will hold (≥1)
  // What the WRK wants (capabilities) and physically needs (typed packing) — the
  // same requirements peers advertise via Engine/ServerQuery kind=WORKLOADS. The
  // Signals engine reads these to reconcile YuniKorn queue guarantees/maximums.
  repeated string capabilities = 5;  // thinking | complete | clt | sae | …
  zndx.engine.v1.WorkloadRequirements requirements = 6;  // typed: backend/parallelism/footprint/kserve
  zndx.engine.v1.ResourceClass resource_class = 7;  // occupancy class (what it needs)
  // Declared intent (zndx.supervision.v1.ResourceIntent, emitted per phase):
  // FLOOR is the non-preemptible part of the footprint — the guaranteed tokens
  // the arbiter must hold for this WRK; the footprint stays what is RESIDENT.
  // Before this field the two were conflated (guaranteed = tokens at admit),
  // so a probe's occupancy was protected against the run that needed the GPU.
  // `optional` so PRESENCE is explicit: an absent floor is a legacy intent
  // (footprint/guaranteed decides); a present 0 is a DECLARED "fully
  // preemptible". PRIORITY orders victims within a leaf (0 = unspecified);
  // the peer stamps it on the sentinel, the arbiter records it.
  optional int32 floor = 8;
  int32 priority = 9;
  // Who declared this intent: the run / process that emitted it (a workload id
  // such as `ambient-synthesis-28633`, or a standing process id), empty for
  // the workload's own admission claim. Identity for implicit supersession is
  // (peer, queue, wrk, owner): a declarer re-stating its intent for a workload
  // on a leaf replaces its own prior record; intents from DIFFERENT declarers
  // for the same shared workload (e.g. `embedding` held for an admit flow AND
  // for an ambient run) coexist and merge (max per leaf). Before this field,
  // supersession was keyed by (peer, queue) and any later request on a leaf
  // retired every other live intent on it (2026-09-04: a probe's floor-0
  // request superseded a running flow's floor-1 embedding intent).
  string owner = 10;
}

message QueueShare {
  string queue = 1;                 // FQN
  ResourceMap guaranteed = 2;       // backend keys; GPU token = federation.zndx.org/gpu
  ResourceMap max = 3;
  int32 max_applications = 4;
}

message QueueShareRequest {
  string peer = 1;                  // gaius | aegir | atelier
  string request_id = 2;            // uuidv7; idempotent
  int64 valid_from_ns = 3;          // unix ns; 0 = now
  int64 valid_until_ns = 4;         // 0 = until superseded
  string reason = 5;                // human: "article_curate extract floor for preemption"
  string supersedes_request_id = 6; // optional prior request_id
  repeated WorkloadIntent workloads = 7;
  repeated QueueShare shares = 8;   // one per queue this request touches
}

message QueueShareResponse {
  bool accepted = 1;                // recorded (apply may be later)
  string request_id = 2;
  QueueShareState state = 3;
  string error = 4;                 // guru when Signals cannot persist
}

message ListQueueShareRequestsRequest {
  string peer = 1;                  // empty = all peers
  string queue = 2;                 // empty = all queues
  int64 since_ns = 3;               // 0 = unbounded
  int32 limit = 4;                  // 0 = backend default
}

message QueueShareRecord {
  QueueShareRequest request = 1;
  int64 recorded_at_ns = 2;
  QueueShareState state = 3;
  // Apply outcome, so peers can score the arbiter: when the backend config
  // matched, how long the apply took, and the last apply error if the
  // record fell back from APPLYING to RECORDED.
  int64 applied_at_ns = 4;          // 0 until APPLIED
  int32 apply_ms = 5;               // wall time of the successful apply batch
  string apply_error = 6;           // last failure while APPLYING (empty when none)
}

message ListQueueShareRequestsResponse {
  repeated QueueShareRecord records = 1;
}

// ── Coordination Activities (added 2026-09-06 — additive v1) ────────────
//
// Signals owns the coordination DAGs in the shared Airflow and holds a LEASE
// per activity (heartbeat, horizon, TTL). Airflow OBSERVES the activity the
// way it observes any external process — a deferrable Sensor whose trigger
// polls the lease — so nobody patches a run's state. Declare = one dag run
// whose conf is the declaration; Renew = a heartbeat on the lease (re-sets
// the horizon; no new run); Release = the lease marked released, which the
// sensor observes (run success → RELEASED); heartbeats stopping for the TTL
// or the horizon passing = lapsed, observed the same way (→ EXPIRED). The
// Airflow run state is the truth peers read.

message DeclareActivityRequest {
  string peer = 1;                  // declaring engine's project (must be an allowed peer)
  string request_id = 2;            // uuidv7; idempotent (a retry returns the same activity)
  string kind = 3;                  // interactive_session | curation_window | restart_window | maintenance_pause | …
  string owner = 4;                 // the declarer within the peer
  int64 horizon_ns = 5;             // unix ns; the intent expires here unless renewed/released
  repeated zndx.engine.v1.ActivityClaim claims = 6;
  repeated string precludes = 7;    // YK leaf FQNs peers must not admit into while RUNNING
  map<string, string> postures = 8; // "<project>.endpoint.<alias>" → "hold-uptime", …
  string reason = 9;
}

message RenewActivityRequest {
  string peer = 1;
  string activity_id = 2;
  int64 horizon_ns = 3;             // the new horizon (must be later than now)
}

message ReleaseActivityRequest {
  string peer = 1;
  string activity_id = 2;
  string outcome = 3;               // human: "hangup", "session ended", "aborted: …"
}

message ActivityResponse {
  bool accepted = 1;
  zndx.engine.v1.Activity activity = 2;
  string error = 3;                 // guru when Signals cannot reach Airflow / refuses the peer
}

message ListActivitiesRequest {
  string peer = 1;                  // empty = all peers
  string kind = 2;                  // empty = all kinds
  bool active_only = 3;             // QUEUED + RUNNING only
  int64 since_ns = 4;               // 0 = Signals default window
  int32 limit = 5;                  // 0 = backend default
}

message ListActivitiesResponse {
  repeated zndx.engine.v1.Activity activities = 1;
  int64 observed_ns = 2;            // when Signals last read Airflow
}

message WatchActivitiesRequest {
  string peer = 1;                  // the watching engine's project (for the log)
}

// Every event carries the FULL set of activities in force (QUEUED/RUNNING)
// plus those that ended within Signals' trailing window (≥ 5 min) so a
// watcher sees terminal states once; a client REPLACES its view on every
// event — absence means ended. Signals emits on change and at least every
// 60 s as a heartbeat, so a silent stream is a dead stream.
message ActivityWatchEvent {
  repeated zndx.engine.v1.Activity activities = 1;
  int64 observed_ns = 2;
}

// ── Workload catalogue (added 2026-09-07 — additive v1) ─────────────────
//
// A peer ENGINE submits the full catalogue of the workloads it runs; Signals
// replaces that peer's entries (a `replace` sync is the whole truth for the
// peer; an entry absent from the sync is retired from Airflow — paused, its
// history kept). Signals materialises enabled entries as Airflow DAGs
// (`ScheduleHint.airflow_dag_id`, default "<peer>_<kind>") through its
// dynamic DAG registry; entries with `after` are Asset-scheduled on the named
// workloads' ended Assets; entries with `source = engine` are catalogued for
// visibility but declared by the engine itself (Scheduler/DeclareActivity).

message SyncWorkloadsRequest {
  string peer = 1;                                  // submitting engine's project
  repeated zndx.engine.v1.ScheduleHint workloads = 2;
  bool replace = 3;                                 // true = this is the peer's whole catalogue
  string engine_build = 4;                          // the submitting engine's revision (for the registry's provenance)
}

message WorkloadRecord {
  zndx.engine.v1.ScheduleHint workload = 1;
  string peer = 2;
  string dag_id = 3;                                // materialised DAG id ("" for source=engine)
  int64 synced_ns = 4;
  string state = 5;                                 // materialized | paused | engine_declared | error
  string error = 6;
}

message SyncWorkloadsResponse {
  bool accepted = 1;
  repeated WorkloadRecord records = 2;
  string error = 3;                                 // guru when Signals cannot persist / reach Airflow
}

message ListWorkloadsRequest {
  string peer = 1;                                  // empty = all peers
}

message ListWorkloadsResponse {
  repeated WorkloadRecord records = 1;
  int64 observed_ns = 2;
}
